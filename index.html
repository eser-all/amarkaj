<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Amarkaj - প্রফেশনাল টুলস + AI Edit</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/browser-image-compression@2.0.2/dist/browser-image-compression.js"></script>

  <!-- Firebase -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-app.js";
    import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-auth.js";
    import { getFirestore } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore.js";
    import { getStorage } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-storage.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCzmfEg39TV0cxGkSKivO7lYsier3KH9AY",
      authDomain: "amarkaj-c7d5f.firebaseapp.com",
      projectId: "amarkaj-c7d5f",
      storageBucket: "amarkaj-c7d5f.firebasestorage.app",
      messagingSenderId: "183473425547",
      appId: "1:183473425547:web:f713861eeaac48b978188e",
      measurementId: "G-HXVW2W079G"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const storage = getStorage(app);

    onAuthStateChanged(auth, (user) => {
      if (!user) signInAnonymously(auth).catch(console.error);
    });

    window.firebaseApp = { auth, db, storage };
  </script>

  <style>
    .tool-card {
      @apply bg-white rounded-2xl p-6 shadow-md hover:shadow-xl transition cursor-pointer text-center border border-gray-100;
    }
    .tool-card:hover { transform: translateY(-4px); }
    .btn-primary {
      @apply bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-5 py-2.5 rounded-xl transition text-sm;
    }
    .btn-secondary {
      @apply bg-gray-100 hover:bg-gray-200 text-gray-800 font-medium px-5 py-2.5 rounded-xl transition text-sm;
    }
    .tool-panel { display: none; }
    .tool-panel.active { display: block; }
  </style>
</head>
<body class="bg-gray-50 text-gray-800">

  <!-- Header -->
  <header class="bg-white shadow-sm sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
      <h1 class="text-2xl font-bold text-indigo-600">Amarkaj</h1>
      <span class="text-sm text-gray-500">AI + প্রফেশনাল টুলস</span>
    </div>
  </header>

  <!-- Hero -->
  <section class="bg-gradient-to-r from-indigo-600 to-purple-600 text-white py-14">
    <div class="max-w-4xl mx-auto px-4 text-center">
      <h2 class="text-3xl md:text-5xl font-bold mb-3">সব ডিজিটাল কাজ এক জায়গায়</h2>
      <p class="text-lg opacity-90">AI ফটো এডিট • কম্প্রেস • কনভার্ট • OCR • NID/Passport to PDF</p>
    </div>
  </section>

  <!-- Tools Grid -->
  <section class="max-w-6xl mx-auto px-4 py-14">
    <h3 class="text-2xl font-bold text-center mb-10">টুলস বেছে নিন</h3>

    <div class="grid grid-cols-2 md:grid-cols-4 gap-5">
      <div class="tool-card" onclick="showTool('ai')">
        <div class="text-4xl mb-3">🤖</div>
        <h4 class="font-semibold">AI ফটো এডিট</h4>
      </div>

      <div class="tool-card" onclick="showTool('compress')">
        <div class="text-4xl mb-3">📦</div>
        <h4 class="font-semibold">ইমেজ কম্প্রেস</h4>
      </div>

      <div class="tool-card" onclick="showTool('convert')">
        <div class="text-4xl mb-3">🔄</div>
        <h4 class="font-semibold">ইমেজ কনভার্ট</h4>
      </div>

      <div class="tool-card" onclick="showTool('ocr')">
        <div class="text-4xl mb-3">📝</div>
        <h4 class="font-semibold">ছবি থেকে লেখা</h4>
      </div>

      <div class="tool-card" onclick="showTool('nid')">
        <div class="text-4xl mb-3">🪪</div>
        <h4 class="font-semibold">NID → PDF</h4>
      </div>

      <div class="tool-card" onclick="showTool('passport')">
        <div class="text-4xl mb-3">🛂</div>
        <h4 class="font-semibold">পাসপোর্ট → PDF</h4>
      </div>
    </div>
  </section>

  <!-- Workspace -->
  <section id="workspace" class="max-w-3xl mx-auto px-4 pb-20 hidden">
    <div class="bg-white rounded-2xl shadow-xl p-6 md:p-8">
      <div class="flex justify-between items-center mb-6">
        <h3 id="tool-title" class="text-xl font-bold"></h3>
        <button onclick="hideTool()" class="text-gray-400 hover:text-red-500 text-xl">✕</button>
      </div>

      <!-- ==================== AI EDIT PANEL ==================== -->
      <div id="panel-ai" class="tool-panel">
        <input type="file" id="ai-input" accept="image/*" class="mb-4 block w-full">
        
        <div class="flex flex-wrap gap-3 mb-6">
          <button onclick="aiEnhance()" class="btn-primary">Auto Enhance</button>
          <button onclick="aiRemoveBg()" class="btn-primary">Background Remove</button>
          <button onclick="aiReset()" class="btn-secondary">রিসেট</button>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div>
            <p class="text-sm text-gray-500 mb-2">আসল ছবি</p>
            <img id="ai-original" class="w-full rounded-xl border hidden" />
          </div>
          <div>
            <p class="text-sm text-gray-500 mb-2">AI এডিটেড</p>
            <img id="ai-result" class="w-full rounded-xl border hidden" />
            <a id="ai-download" class="btn-primary inline-block mt-4 hidden">ডাউনলোড করুন</a>
          </div>
        </div>

        <p id="ai-status" class="mt-4 text-sm text-gray-500"></p>
      </div>

      <!-- Compress -->
      <div id="panel-compress" class="tool-panel">
        <input type="file" id="compress-input" accept="image/*" class="mb-4 block w-full">
        <div class="mb-4">
          <label class="block text-sm mb-1">কোয়ালিটি: <span id="quality-value">80%</span></label>
          <input type="range" id="quality" min="0.1" max="1" step="0.05" value="0.8" class="w-full">
        </div>
        <button onclick="compressImage()" class="btn-primary">কম্প্রেস করুন</button>
        <div id="compress-result" class="mt-6"></div>
      </div>

      <!-- Convert -->
      <div id="panel-convert" class="tool-panel">
        <input type="file" id="convert-input" accept="image/*" class="mb-4 block w-full">
        <select id="convert-format" class="border rounded-lg px-4 py-2 mb-4 w-full">
          <option value="image/png">PNG</option>
          <option value="image/jpeg">JPG</option>
          <option value="image/webp">WebP</option>
        </select>
        <button onclick="convertImage()" class="btn-primary">কনভার্ট করুন</button>
        <div id="convert-result" class="mt-6"></div>
      </div>

      <!-- OCR -->
      <div id="panel-ocr" class="tool-panel">
        <input type="file" id="ocr-input" accept="image/*" class="mb-4 block w-full">
        <button onclick="runOCR()" class="btn-primary">লেখা বের করুন</button>
        <div id="ocr-result" class="mt-6 p-4 bg-gray-50 rounded-xl min-h-24 text-sm whitespace-pre-wrap"></div>
      </div>

      <!-- NID -->
      <div id="panel-nid" class="tool-panel">
        <input type="file" id="nid-input" accept="image/*" class="mb-4 block w-full">
        <button onclick="createPdf('nid')" class="btn-primary">NID PDF তৈরি করুন</button>
        <div id="nid-result" class="mt-6"></div>
      </div>

      <!-- Passport -->
      <div id="panel-passport" class="tool-panel">
        <input type="file" id="passport-input" accept="image/*" class="mb-4 block w-full">
        <button onclick="createPdf('passport')" class="btn-primary">পাসপোর্ট PDF তৈরি করুন</button>
        <div id="passport-result" class="mt-6"></div>
      </div>
    </div>
  </section>

  <script>
    // ========== UI Control ==========
    function showTool(tool) {
      document.getElementById('workspace').classList.remove('hidden');
      document.querySelectorAll('.tool-panel').forEach(p => p.classList.remove('active'));

      const titles = {
        ai: 'AI ফটো এডিট',
        compress: 'ইমেজ কম্প্রেস',
        convert: 'ইমেজ কনভার্ট',
        ocr: 'ছবি থেকে লেখা (OCR)',
        nid: 'NID কার্ড → PDF',
        passport: 'পাসপোর্ট → PDF'
      };

      document.getElementById('tool-title').textContent = titles[tool];
      document.getElementById('panel-' + tool).classList.add('active');
      window.scrollTo({ top: document.getElementById('workspace').offsetTop - 70, behavior: 'smooth' });
    }

    function hideTool() {
      document.getElementById('workspace').classList.add('hidden');
    }

    document.getElementById('quality').addEventListener('input', function() {
      document.getElementById('quality-value').textContent = Math.round(this.value * 100) + '%';
    });

    // ========== AI EDIT ==========
    let aiOriginalFile = null;

    document.getElementById('ai-input').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;
      aiOriginalFile = file;
      const url = URL.createObjectURL(file);
      const img = document.getElementById('ai-original');
      img.src = url;
      img.classList.remove('hidden');
      document.getElementById('ai-result').classList.add('hidden');
      document.getElementById('ai-download').classList.add('hidden');
      document.getElementById('ai-status').textContent = 'ছবি লোড হয়েছে। এখন এডিট বাটনে ক্লিক করুন।';
    });

    // Auto Enhance (Canvas based)
    function aiEnhance() {
      if (!aiOriginalFile) return alert('আগে একটি ছবি সিলেক্ট করুন');

      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          canvas.width = img.width;
          canvas.height = img.height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0);

          // Simple enhance: increase contrast & brightness
          const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
          const data = imageData.data;
          const contrast = 1.25;
          const brightness = 12;

          for (let i = 0; i < data.length; i += 4) {
            data[i] = truncate(((data[i] - 128) * contrast) + 128 + brightness);     // R
            data[i+1] = truncate(((data[i+1] - 128) * contrast) + 128 + brightness); // G
            data[i+2] = truncate(((data[i+2] - 128) * contrast) + 128 + brightness); // B
          }
          ctx.putImageData(imageData, 0, 0);

          canvas.toBlob(function(blob) {
            const url = URL.createObjectURL(blob);
            const resultImg = document.getElementById('ai-result');
            resultImg.src = url;
            resultImg.classList.remove('hidden');

            const downloadBtn = document.getElementById('ai-download');
            downloadBtn.href = url;
            downloadBtn.download = 'ai-enhanced.png';
            downloadBtn.classList.remove('hidden');
            document.getElementById('ai-status').textContent = 'Auto Enhance সম্পন্ন!';
          }, 'image/png');
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(aiOriginalFile);
    }

    function truncate(value) {
      return Math.max(0, Math.min(255, value));
    }

    // Background Remove (Remove.bg API structure)
    async function aiRemoveBg() {
      if (!aiOriginalFile) return alert('আগে একটি ছবি সিলেক্ট করুন');

      // ============================================
      // এখানে আপনার Remove.bg API Key দিন
      const API_KEY = 'YOUR_REMOVE_BG_API_KEY_HERE';
      // ============================================

      if (API_KEY === 'YOUR_REMOVE_BG_API_KEY_HERE') {
        document.getElementById('ai-status').innerHTML = `
          <span class="text-orange-600">
            Background Remove কাজ করতে Remove.bg API Key লাগবে।<br>
            <a href="https://www.remove.bg/api" target="_blank" class="underline">এখান থেকে ফ্রি API Key নিন</a> 
            এবং কোডে <code>YOUR_REMOVE_BG_API_KEY_HERE</code> এর জায়গায় বসান।
          </span>
        `;
        return;
      }

      document.getElementById('ai-status').textContent = 'Background Remove হচ্ছে... অনুগ্রহ করে অপেক্ষা করুন';

      const formData = new FormData();
      formData.append('image_file', aiOriginalFile);
      formData.append('size', 'auto');

      try {
        const response = await fetch('https://api.remove.bg/v1.0/removebg', {
          method: 'POST',
          headers: { 'X-Api-Key': API_KEY },
          body: formData
        });

        if (!response.ok) throw new Error('API Error: ' + response.status);

        const blob = await response.blob();
        const url = URL.createObjectURL(blob);

        const resultImg = document.getElementById('ai-result');
        resultImg.src = url;
        resultImg.classList.remove('hidden');

        const downloadBtn = document.getElementById('ai-download');
        downloadBtn.href = url;
        downloadBtn.download = 'no-background.png';
        downloadBtn.classList.remove('hidden');
        document.getElementById('ai-status').textContent = 'Background সফলভাবে রিমুভ হয়েছে!';
      } catch (err) {
        document.getElementById('ai-status').textContent = 'ব্যর্থ: ' + err.message;
      }
    }

    function aiReset() {
      document.getElementById('ai-input').value = '';
      document.getElementById('ai-original').classList.add('hidden');
      document.getElementById('ai-result').classList.add('hidden');
      document.getElementById('ai-download').classList.add('hidden');
      document.getElementById('ai-status').textContent = '';
      aiOriginalFile = null;
    }

    // ========== অন্যান্য টুলস (আগের মতো) ==========
    async function compressImage() {
      const file = document.getElementById('compress-input').files[0];
      if (!file) return alert('ছবি সিলেক্ট করুন');
      const quality = parseFloat(document.getElementById('quality').value);
      try {
        const compressed = await imageCompression(file, {
          maxSizeMB: 1, maxWidthOrHeight: 1920, useWebWorker: true, initialQuality: quality
        });
        const url = URL.createObjectURL(compressed);
        document.getElementById('compress-result').innerHTML = `
          <p class="text-sm">আসল: ${(file.size/1024).toFixed(1)} KB → ${(compressed.size/1024).toFixed(1)} KB</p>
          <a href="${url}" download="compressed.jpg" class="btn-primary inline-block mt-3">ডাউনলোড</a>`;
      } catch (err) { alert(err.message); }
    }

    function convertImage() {
      const file = document.getElementById('convert-input').files[0];
      const format = document.getElementById('convert-format').value;
      if (!file) return alert('ছবি সিলেক্ট করুন');
      const reader = new FileReader();
      reader.onload = e => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          canvas.width = img.width; canvas.height = img.height;
          canvas.getContext('2d').drawImage(img, 0, 0);
          canvas.toBlob(blob => {
            const url = URL.createObjectURL(blob);
            document.getElementById('convert-result').innerHTML = 
              `<a href="\( {url}" download="converted. \){format.split('/')[1]}" class="btn-primary inline-block">ডাউনলোড</a>`;
          }, format, 0.92);
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    async function runOCR() {
      const file = document.getElementById('ocr-input').files[0];
      if (!file) return alert('ছবি সিলেক্ট করুন');
      const resultDiv = document.getElementById('ocr-result');
      resultDiv.textContent = 'প্রসেস হচ্ছে...';
      try {
        const { data: { text } } = await Tesseract.recognize(file, 'ben+eng');
        resultDiv.textContent = text || 'কোনো লেখা পাওয়া যায়নি';
      } catch (err) { resultDiv.textContent = 'ব্যর্থ: ' + err.message; }
    }

    function createPdf(type) {
      const inputId = type === 'nid' ? 'nid-input' : 'passport-input';
      const resultId = type === 'nid' ? 'nid-result' : 'passport-result';
      const file = document.getElementById(inputId).files[0];
      if (!file) return alert('ছবি সিলেক্ট করুন');
      const reader = new FileReader();
      reader.onload = e => {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: type === 'nid' ? [85.6, 53.98] : 'a4' });
        const img = new Image();
        img.onload = () => {
          if (type === 'nid') doc.addImage(img, 'JPEG', 0, 0, 85.6, 53.98);
          else {
            const w = doc.internal.pageSize.getWidth();
            const h = doc.internal.pageSize.getHeight();
            doc.addImage(img, 'JPEG', 10, 10, w-20, h-20);
          }
          doc.save(type + '-document.pdf');
          document.getElementById(resultId).innerHTML = `<p class="text-green-600">PDF তৈরি ও ডাউনলোড হয়েছে!</p>`;
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }
  </script>
</body>
</html>
